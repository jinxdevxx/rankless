<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060d">
<title>Rankless</title>
<meta name="description" content="Rankless - rise from the weakest E-Rank Breaker. Clear gates, hunt loot, bind monsters and climb the ranks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="scene"></canvas>

<!-- CREATE -->
<section id="scr-create" class="scr">
  <div class="create-panel win sys">
    <div class="logo">RANKLESS</div>
    <div class="tagline">From E-Rank to legend</div>
    <div class="bt">[ BREAKER REGISTRATION ]</div>
    <label class="lbl">Codename</label>
    <input id="cName" type="text" maxlength="14" placeholder="e.g. VANTA" autocomplete="off" spellcheck="false">
    <label class="lbl">Affinity</label>
    <div id="affList" class="affs"></div>
    <div id="affInfo" class="affinfo"></div>
    <label class="lbl">Hair</label>
    <div id="hairList" class="chips"></div>
    <button class="btn primary big" data-a="create">AWAKEN</button>
  </div>
</section>

<!-- HOME -->
<section id="scr-home" class="scr">
  <header id="topbar" class="topbar"></header>
  <div id="homeActions" class="home-actions"></div>
  <div id="sheet" class="sheet">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="ibtn" data-a="closeSheet">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
  <nav class="nav">
    <button data-a="sheet" data-id="home"><span class="ic"></span>Home</button>
    <button data-a="sheet" data-id="gates"><span class="ic"></span>Gates</button>
    <button data-a="sheet" data-id="arena"><span class="ic"></span>Arena</button>
    <button data-a="sheet" data-id="hero"><span class="ic"></span>Champion</button>
    <button data-a="sheet" data-id="bag"><span class="ic"></span>Bag</button>
    <button data-a="sheet" data-id="legion"><span class="ic"></span>Legion</button>
  </nav>
</section>

<!-- BATTLE -->
<section id="scr-battle" class="scr">
  <div class="b-top">
    <button class="ibtn" data-a="exit" title="Leave">‹</button>
    <div id="bTitle" class="b-title"></div>
    <span class="sp"></span>
    <button id="bFarm" class="tbtn" data-a="farm">Farm: Off</button>
    <button id="bAuto" class="tbtn" data-a="auto">AUTO</button>
    <button id="bSpeed" class="tbtn" data-a="speed">x1</button>
  </div>
  <div id="bBoss" class="b-boss"><b></b><div class="bar"><i></i></div></div>
  <div id="bParty" class="b-party"></div>
  <div id="bSkills" class="b-skills"></div>
  <div id="bResult" class="b-result"></div>
</section>

<div id="toasts"></div>
<div id="modal"></div>

<script>
/* Loads the newest game files. version.json is fetched fresh every time, and every
   file is requested with ?v=<version>, so a new patch is picked up on the next reload. */
(function(){
  const FILES = ['js/data.js','js/state.js','js/art.js','js/battle.js','js/ui.js','js/main.js'];
  function boot(info){
    window.GAME_PATCH = info; window.GAME_VERSION = info.version;
    const v = encodeURIComponent(info.version);
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'style.css?v=' + v; document.head.appendChild(css);
    FILES.forEach(f => { const s = document.createElement('script'); s.src = f + '?v=' + v; s.async = false; document.body.appendChild(s); });
  }
  fetch('version.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(boot)
    .catch(() => boot({version:'dev', title:'', notes:[]}));
})();
</script>
</body>
</html>
